name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Aceitar licenças do SDK
        run: yes | sdkmanager --licenses || true
      - name: Descompactar projeto
        run: |
          ZIP=$(find . -name 'SoulOfDarkness_Hibrido.zip' | head -n 1)
          echo "Zip encontrado: $ZIP"
          unzip -q "$ZIP" -d /tmp/proj
          ls /tmp/proj
      - name: Build debug APK
        run: |
          cd /tmp/proj/SoulOfDarkness_Hibrido
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SoulOfDarkness-hibrido-apk
          path: /tmp/proj/SoulOfDarkness_Hibrido/app/build/outputs/apk/debug/app-debug.apk
